# A three-node NATS cluster with JetStream on persistent volumes. Edges connect through a leaf
# node or a TLS listener at the plant; this manifest covers the cloud side.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
data:
  nats.conf: |
    port: 4222
    http_port: 8222
    server_name: $POD_NAME
    jetstream { store_dir: /data/jetstream, max_file_store: 20G }
    cluster {
      name: nova
      port: 6222
      routes: [
        nats://nats-0.nats:6222
        nats://nats-1.nats:6222
        nats://nats-2.nats:6222
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels: { app.kubernetes.io/name: nats }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: nats }
  ports:
    - { name: client, port: 4222 }
    - { name: cluster, port: 6222 }
    - { name: monitor, port: 8222 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
spec:
  serviceName: nats
  replicas: 3
  selector:
    matchLabels: { app.kubernetes.io/name: nats }
  template:
    metadata:
      labels: { app.kubernetes.io/name: nats }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nats
          image: nats:2.12-alpine
          args: ["-c", "/etc/nats/nats.conf"]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          ports:
            - { name: client, containerPort: 4222 }
            - { name: cluster, containerPort: 6222 }
            - { name: monitor, containerPort: 8222 }
          readinessProbe:
            httpGet: { path: "/healthz?js-enabled-only=true", port: monitor }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/nats }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: nats-config }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 25Gi }
